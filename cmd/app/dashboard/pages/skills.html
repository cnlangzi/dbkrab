<!--layout:dashboard-->
{{ define "content" }}
<div class="pb-24 space-y-4">
    <!-- Page Header -->
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-text">Skills</h1>
        <a href="/monitor/skills" class="text-sm text-primary hover:text-primaryHover flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
            Monitor
        </a>
    </div>

    <!-- Stats Summary -->
    <div class="bg-surface rounded-xl p-4 border border-border">
        <div class="flex items-center gap-2 mb-2">
            <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            <span class="text-textMuted text-sm">Loaded Skills</span>
        </div>
        <p class="text-2xl font-bold text-text" id="skills-count">-</p>
    </div>

    <!-- Skills List -->
    <div class="bg-surface rounded-xl border border-border overflow-hidden">
        <div class="p-4 border-b border-border">
            <h2 class="text-lg font-semibold text-text">Loaded Skills</h2>
            <p class="text-xs text-textMuted mt-0.5">Tap to edit</p>
        </div>
        <div id="skills-list" class="divide-y divide-border">
            <div class="p-6 text-center">
                <div class="animate-pulse flex flex-col items-center">
                    <div class="w-12 h-12 bg-surfaceHover rounded-full mb-3"></div>
                    <div class="h-4 bg-surfaceHover rounded w-24"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bottom Action Bar -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-bg/95 backdrop-blur border-t border-border lg:hidden">
    <a href="/skills/new" 
       class="w-full py-3 bg-primary hover:bg-primaryHover text-white font-medium rounded-xl transition-colors flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        New Skill
    </a>
</div>

<!-- Desktop FAB -->
<div class="hidden lg:flex fixed bottom-6 right-6">
    <a href="/skills/new" 
       class="p-4 bg-primary hover:bg-primaryHover text-white rounded-full shadow-lg transition-colors"
       title="New Skill">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
    </a>
</div>

<script>
// Load skills list
async function loadSkillsList() {
    try {
        const response = await fetch('/api/skills/list');
        const data = await response.json();
        
        if (data.success) {
            renderSkillsList(data.skills);
            document.getElementById('skills-count').textContent = data.skills.length;
        } else {
            document.getElementById('skills-list').innerHTML = 
                '<div class="p-6 text-center text-error">' + (data.error || 'Failed to load skills') + '</div>';
        }
    } catch (err) {
        document.getElementById('skills-list').innerHTML = 
            '<div class="p-6 text-center text-error">Error: ' + err.message + '</div>';
    }
}

// Track deleting state per skill id
const deletingSkills = new Set();

function escapeHtml(str) {
    return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

function renderSkillsList(skills) {
    const container = document.getElementById('skills-list');
    
    if (skills.length === 0) {
        container.innerHTML = `
            <div class="p-8 text-center">
                <svg class="w-16 h-16 mx-auto mb-4 text-textMuted opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                <p class="text-textMuted">No skills loaded</p>
                <p class="text-sm text-textMuted mt-1">Create your first skill to get started</p>
            </div>
        `;
        return;
    }
    
    let html = '';
    skills.forEach(skill => {
        const statusClass = skill.status === 'error' ? 'bg-error/20 text-error' : 'bg-success/20 text-success';
        const statusText = skill.status === 'error' ? 'Error' : 'Active';
        const escapedName = escapeHtml(skill.name);
        const escapedDesc = escapeHtml(skill.description || '');
        const escapedError = escapeHtml(skill.error || '');
        
        // Build error message if present
        const errorHtml = skill.error ? `<p class="text-xs text-error mt-1 truncate" title="${escapedError}">⚠️ ${escapedError}</p>` : '';
        
        html += `
            <div class="block p-4 hover:bg-surfaceHover transition-colors group relative">
                <a href="/skills/edit/${skill.id}" class="absolute inset-0" tabindex="-1" aria-hidden="true"></a>
                <div class="flex items-start justify-between relative z-10">
                    <div class="flex-1 min-w-0 pr-16">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="px-2 py-0.5 rounded text-xs font-medium ${statusClass}">${statusText}</span>
                            <h4 class="text-base font-semibold text-text truncate">${escapedName}</h4>
                        </div>
                        ${skill.description ? `<p class="text-sm text-textMuted truncate">${escapedDesc}</p>` : ''}
                        ${errorHtml}
                        <div class="flex items-center gap-3 mt-2 text-xs text-textMuted">
                            <span>📊 ${skill.tables ? skill.tables.length : 0} tables</span>
                            ${skill.load_time ? `<span>🕐 ${skill.load_time}</span>` : ''}
                        </div>
                    </div>
                    <div class="flex items-center gap-2 flex-shrink-0 ml-2">
                        <button
                            data-skill-id="${skill.id}"
                            data-skill-name="${escapedName}"
                            class="delete-btn p-2 text-textMuted hover:text-error hover:bg-error/10 rounded-lg transition-colors opacity-60 hover:opacity-100 focus:opacity-100"
                            title="Delete skill"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        `;
    });
    
    container.innerHTML = html;
}

// Event delegation for delete buttons
document.getElementById('skills-list').addEventListener('click', function(e) {
    const btn = e.target.closest('.delete-btn');
    if (!btn) return;
    
    e.stopPropagation();
    
    const id = btn.dataset.skillId;
    const name = btn.dataset.skillName;
    
    // Prevent double-click
    if (deletingSkills.has(id)) {
        return;
    }
    
    if (!confirm(`Delete skill "${name}"? This cannot be undone.`)) {
        return;
    }
    
    deletingSkills.add(id);
    deleteSkill(id);
});

async function deleteSkill(id) {
    try {
        const response = await fetch(`/api/skills/${id}`, {
            method: 'DELETE'
        });
        
        // Handle 204 No Content
        if (response.status === 204 || response.status === 200) {
            deletingSkills.delete(id);
            loadSkillsList();
            return;
        }
        
        // Parse JSON body for other responses
        let data;
        const contentType = response.headers.get('content-type') || '';
        if (contentType.includes('application/json')) {
            data = await response.json();
        } else {
            data = { success: false, error: 'Unexpected response format' };
        }
        
        deletingSkills.delete(id);
        if (data.success) {
            loadSkillsList();
        } else {
            alert('Failed to delete skill: ' + (data.error || 'Unknown error'));
        }
    } catch (err) {
        deletingSkills.delete(id);
        alert('Error deleting skill: ' + err.message);
    }
}

// Initial load
loadSkillsList();
</script>
{{ end }}
